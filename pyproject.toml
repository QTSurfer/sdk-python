[project]
name = "qtsurfer-sdk"
version = "0.2.0"
description = "Opinionated Python SDK for QTSurfer — auth helper with refresh, pluggable token storage, and high-level workflows (strategies, backtest, sweep, datasets) over qtsurfer-api-client."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Manuel Polo", email = "mrmx@users.noreply.github.com" },
]
keywords = ["qtsurfer", "sdk", "trading", "backtest", "auth", "jwt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "qtsurfer-api-client==0.111.2",
    "httpx>=0.23,<1",
]

[project.urls]
Homepage = "https://github.com/QTSurfer/sdk-python"
Repository = "https://github.com/QTSurfer/sdk-python"
Issues = "https://github.com/QTSurfer/sdk-python/issues"
"OpenAPI Spec" = "https://github.com/QTSurfer/qtsurfer-api"
"API Client" = "https://github.com/QTSurfer/api-client-python"
"SDK (Java)" = "https://github.com/QTSurfer/sdk-java"
"SDK (TypeScript)" = "https://github.com/QTSurfer/sdk-ts"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtsurfer_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
